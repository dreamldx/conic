[project]
name = "conic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0",
    "discord-py>=2.4",
    "duckdb>=1.5.5",
    "loguru>=0.7",
    "openai>=3.13.0",
    "jinja2>=3.1",
    "shellingham>=1.5.4",
]

[project.scripts]
conic = "conic.entry:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
